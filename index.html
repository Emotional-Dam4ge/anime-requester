<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Requester</title>
    <link rel="stylesheet" href="style/style.css">
</head>

<body>

    <header class="mainHeader">
        <div class="headerContent">
            <span class="headerSpacer" aria-hidden="true"></span>
            <h1>ANIME REQUESTER</h1>

            <div class="themeControls" role="group" aria-label="Choisir le thème">
                <button
                    type="button"
                    class="themeButton"
                    id="lightThemeButton"
                    aria-label="Activer le thème clair"
                    aria-pressed="true"
                    title="Thème clair">
                    <span aria-hidden="true">☀️</span>
                </button>

                <button
                    type="button"
                    class="themeButton"
                    id="darkThemeButton"
                    aria-label="Activer le thème sombre"
                    aria-pressed="false"
                    title="Thème sombre">
                    <span aria-hidden="true">🌙</span>
                </button>
            </div>
        </div>
    </header>

    <main class="mainContainer">
        <form id="searchForm" class="searchForm">
            <div class="formGroup">
                <label for="searchType">Choisissez un type de recherche :</label>
                <select id="searchType" name="searchType" required>
                    <option value="title">Recherche par titre</option>
                    <option value="id">Recherche par identifiant</option>
                    <option value="ranking">Recherche par classement</option>
                </select>
            </div>

            <div class="formGroup">
                <label for="searchParam">Paramètre :</label>
                <input
                    type="text"
                    id="searchParam"
                    name="searchParam"
                    required
                    autocomplete="off">
            </div>

            <div class="buttonGroup">
                <button type="submit" id="submitBtn">Rechercher</button>
                <button type="reset" id="resetBtn">Effacer</button>
            </div>
        </form>

        <section id="resultsContainer" class="resultsContainer" aria-live="polite">
            <!-- Les cartes des animes seront ajoutées ici par JavaScript -->
        </section>
    </main>

    <script>
        (() => {
            const lightButton = document.getElementById("lightThemeButton");
            const darkButton = document.getElementById("darkThemeButton");
            const storageKey = "anime-requester-theme";

            function setTheme(theme) {
                const isDark = theme === "dark";

                document.documentElement.dataset.theme = isDark ? "dark" : "light";
                lightButton.setAttribute("aria-pressed", String(!isDark));
                darkButton.setAttribute("aria-pressed", String(isDark));

                try {
                    localStorage.setItem(storageKey, isDark ? "dark" : "light");
                } catch (error) {
                    // Le thème fonctionne aussi si le navigateur bloque le stockage local.
                }
            }

            let savedTheme = null;

            try {
                savedTheme = localStorage.getItem(storageKey);
            } catch (error) {
                // Le mode clair est utilisé si le stockage local est inaccessible.
            }

            setTheme(savedTheme === "dark" ? "dark" : "light");

            lightButton.addEventListener("click", () => setTheme("light"));
            darkButton.addEventListener("click", () => setTheme("dark"));
        })();
    </script>

    <script type="module" src="/script.js"></script>
</body>

</html>
